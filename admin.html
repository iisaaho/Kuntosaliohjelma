<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kuntosaliohjelma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --accent: #1e40af;
    --accent2: #3b82f6;
    --text: #0f172a;
    --text-muted: #64748b;
    --green: #059669;
    --green-bg: #d1fae5;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --yellow: #d97706;
    --yellow-bg: #fef3c7;
    --blue-bg: #eff6ff;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Login ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .login-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(15,23,42,0.08);
  }

  .login-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    font-weight: 400;
    margin-bottom: 0.3rem;
  }

  .login-subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 1.75rem;
  }

  .form-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  .form-input {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 1rem;
  }

  .form-input:focus { border-color: var(--accent2); background: white; }

  .login-btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.2s;
  }

  .login-btn:hover { background: #1d4ed8; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-error {
    color: var(--red);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    display: none;
  }

  .login-error.show { display: block; }

  /* ── Dashboard ── */
  .dashboard { display: none; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
  }

  .topbar-right { display: flex; align-items: center; gap: 1rem; }

  .topbar-user {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .logout-link {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    text-decoration: underline;
  }

  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* ── Stat cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
  }

  .stat-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.2rem;
  }

  .stat-desc {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ── Table ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
  }

  .refresh-btn {
    font-size: 0.8rem;
    color: var(--accent);
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    transition: all 0.2s;
  }

  .refresh-btn:hover { border-color: var(--accent2); background: var(--blue-bg); }

  .table-wrap {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }

  thead {
    background: var(--bg);
    border-bottom: 1.5px solid var(--border);
  }

  th {
    padding: 0.75rem 1.25rem;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover { color: var(--accent); }
  th .sort-arrow { margin-left: 4px; opacity: 0.4; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }

  td {
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--bg);
    color: var(--text);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }

  .username-cell {
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    background: var(--blue-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }

  .badge-pill {
    display: inline-block;
    padding: 0.2rem 0.55rem;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-gray  { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }

  .muted { color: var(--text-muted); }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 3rem; }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 0 1rem; }
    .content { padding: 1.25rem 1rem; }
    td, th { padding: 0.65rem 0.75rem; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-title">Admin</div>
    <div class="login-subtitle">Kuntosaliohjelma — hallintapaneeli</div>
    <label class="form-label">Admin-avain</label>
    <input class="form-input" type="password" id="key-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" id="login-btn" onclick="login()">Kirjaudu sisään</button>
    <div class="login-error" id="login-error">Väärä admin-avain</div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="topbar-title">Kuntosaliohjelma — Admin</div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-info"></span>
      <button class="logout-link" onclick="logout()">Kirjaudu ulos</button>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Käyttäjiä</div>
        <div class="stat-value" id="stat-users">—</div>
        <div class="stat-desc">rekisteröitynyttä</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aktiivisia</div>
        <div class="stat-value" id="stat-active">—</div>
        <div class="stat-desc">tänä kuuna</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ohjelmia</div>
        <div class="stat-value" id="stat-programs">—</div>
        <div class="stat-desc">tallennettua</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sarjoja kirjattu</div>
        <div class="stat-value" id="stat-sets">—</div>
        <div class="stat-desc">kaikkiaan</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">Käyttäjät</div>
      <button class="refresh-btn" onclick="loadData()">↻ Päivitä</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('username')">Käyttäjänimi <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('registeredAt')" class="hide-mobile">Rekisteröitynyt <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('programs')">Ohjelmat <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('workoutDays')">Treenit <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('sets')" class="hide-mobile">Sarjat <span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('lastActive')">Viimeksi aktiivinen <span class="sort-arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <tr class="empty-row"><td colspan="6">Ladataan…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let adminKey = '';
let users = [];
let sortCol = 'lastActive';
let sortAsc = false;

function login() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) return;
  adminKey = key;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Kirjaudutaan…';
  loadData().then(ok => {
    if (!ok) {
      adminKey = '';
      btn.disabled = false;
      btn.textContent = 'Kirjaudu sisään';
      document.getElementById('login-error').classList.add('show');
    }
  });
}

function logout() {
  adminKey = '';
  users = [];
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('key-input').value = '';
  document.getElementById('login-error').classList.remove('show');
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.textContent = 'Kirjaudu sisään';
}

async function loadData() {
  try {
    const res = await fetch('/api/admin/stats', {
      headers: { Authorization: `Bearer ${adminKey}` }
    });
    if (!res.ok) return false;

    const data = await res.json();
    users = data.users;

    document.getElementById('stat-users').textContent   = data.summary.totalUsers;
    document.getElementById('stat-active').textContent  = data.summary.activeThisMonth;
    document.getElementById('stat-programs').textContent = data.summary.totalPrograms;
    document.getElementById('stat-sets').textContent    = data.summary.totalSets;
    document.getElementById('topbar-info').textContent  = `${data.summary.totalUsers} käyttäjää`;

    renderTable();

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    return true;
  } catch {
    return false;
  }
}

function sortBy(col) {
  if (sortCol === col) {
    sortAsc = !sortAsc;
  } else {
    sortCol = col;
    sortAsc = col === 'username';
  }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  const ths = document.querySelectorAll('th');
  const cols = ['username', 'registeredAt', 'programs', 'workoutDays', 'sets', 'lastActive'];
  const idx = cols.indexOf(col);
  if (idx >= 0) ths[idx].classList.add('sorted');
  renderTable();
}

function renderTable() {
  const sorted = [...users].sort((a, b) => {
    let av = a[sortCol] ?? '';
    let bv = b[sortCol] ?? '';
    if (typeof av === 'number') return sortAsc ? av - bv : bv - av;
    return sortAsc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });

  const tbody = document.getElementById('user-table-body');

  if (!sorted.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Ei käyttäjiä vielä</td></tr>';
    return;
  }

  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

  tbody.innerHTML = sorted.map(u => {
    const initial = u.username.charAt(0).toUpperCase();
    const isActive = u.lastActive?.startsWith(thisMonth);
    const activeBadge = isActive
      ? '<span class="badge-pill badge-green">Aktiivinen</span>'
      : '<span class="badge-pill badge-gray">Ei aktiv.</span>';
    const lastDate = u.lastActive ? formatDate(u.lastActive) : '<span class="muted">—</span>';
    return `<tr>
      <td><div class="username-cell">
        <div class="user-avatar">${initial}</div>
        ${escHtml(u.username)}
      </div></td>
      <td class="hide-mobile muted">${formatDate(u.registeredAt)}</td>
      <td>${u.programs}</td>
      <td>${u.workoutDays}</td>
      <td class="hide-mobile">${u.sets}</td>
      <td>${lastDate} ${activeBadge}</td>
    </tr>`;
  }).join('');
}

function formatDate(str) {
  if (!str) return '—';
  const [y, m, d] = str.split('-');
  return `${parseInt(d)}.${parseInt(m)}.${y}`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
