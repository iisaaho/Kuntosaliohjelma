<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuntosaliohjelma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f8ff;
            --surface: #ffffff;
            --surface2: #eff6ff;
            --accent: #1e40af;
            --accent2: #3b82f6;
            --light-blue: #dbeafe;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-blue: #bfdbfe;
            --success: #059669;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 1.25rem 1.25rem;
            width: 100%;
            max-width: 100%;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            cursor: pointer;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-top h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: -0.5px;
            text-align: center;
        }

        /* ── App footer ── */
        #app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 50;
        }

        /* ── Vertical program list ── */
        .program-list-vertical {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .program-card-full {
            flex: none;
            width: 100%;
            text-align: left;
            flex-direction: row;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
        }

        .auth-btn {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .auth-btn:hover { background: var(--text); color: white; border-color: var(--text); }

        .user-info { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
        .username-badge { color: var(--text); font-size: 0.85rem; font-weight: 600; }
        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'DM Sans', sans-serif;
            text-decoration: underline;
            padding: 0;
        }
        .logout-btn:hover { color: var(--text); }

        /* ── Step indicator ── */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: white;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
            transition: all 0.25s;
        }

        .step-dot.active { background: var(--accent); border-color: var(--accent); color: white; }
        .step-dot.done { background: var(--light-blue); border-color: var(--border-blue); color: var(--accent); }

        .step-line {
            width: 60px;
            height: 2px;
            background: var(--border);
            transition: background 0.25s;
        }

        .step-line.done { background: var(--border-blue); }

        .step-label-row {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-top: 0.4rem;
        }

        .step-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            width: 32px;
            text-align: center;
        }

        .step-label.active { color: var(--accent); }
        .step-label-gap { width: 60px; }

        /* ── Day nav ── */
        .day-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1.25rem 1rem 1rem;
        }

        .day-nav-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }


        .day-btn {
            background: white;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 0.65rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
        }

        .day-btn:hover { border-color: var(--accent2); color: var(--accent); }
        .day-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(30,64,175,0.22);
        }

        /* ── Main ── */
        main { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 1.25rem 4rem; }

        /* ── Wizard step views ── */
        .step-view { padding-top: 2.5rem; }

        .step-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.75rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .step-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        /* ── Program cards carousel ── */
        .program-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        .program-track {
            flex: 1;
            display: flex;
            gap: 1rem;
            overflow-x: hidden;
            scroll-behavior: smooth;
            min-width: 0;
            padding: 10px 4px;
            margin: -10px -4px;
        }

        .program-card {
            flex: 0 0 calc(25% - 12px);
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.22s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .program-card:hover {
            border-color: var(--border-blue);
            background: var(--surface2);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(30,64,175,0.1);
        }

.program-card-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 0.4rem;
            color: var(--text);
            line-height: 1.35;
        }

        .program-card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .carousel-arrow {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: white;
            border: 1.5px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-muted);
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            line-height: 1;
        }

        .carousel-arrow:hover { border-color: var(--accent2); color: var(--accent); }

        /* ── Split cards ── */
        .split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .split-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1.75rem 1.25rem;
            cursor: pointer;
            transition: all 0.22s ease;
            text-align: center;
        }

        .split-card:hover {
            border-color: var(--border-blue);
            background: var(--surface2);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(30,64,175,0.1);
        }

        .split-card-number {
            font-family: 'DM Serif Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .split-card-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.35rem;
            letter-spacing: 0.02em;
        }

        .split-card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .split-card.selected {
            border-color: var(--accent);
            background: #eff6ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(30,64,175,0.12);
        }

        /* ── Home page ── */
        .home-section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 1.5rem 0 0.75rem;
        }

        .home-create-card {
            flex: 0 0 calc(25% - 12px);
            background: var(--surface);
            border: 2px dashed var(--border-blue);
            border-radius: 20px;
            padding: 1.5rem 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.22s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
        }

        .home-create-card-wide {
            flex: none;
            width: 100%;
            flex-direction: row;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            min-height: auto;
            text-align: left;
        }

        .home-create-card:hover {
            background: #eff6ff;
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 10px 32px rgba(30,64,175,0.1);
        }

        .home-create-icon {
            font-size: 2rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: var(--accent);
            font-weight: 300;
        }

        .home-create-label {
            font-family: 'DM Serif Display', serif;
            font-size: 0.95rem;
            line-height: 1.35;
            color: var(--accent);
        }

        .home-saved-card { position: relative; }

        .home-saved-delete {
            position: absolute;
            top: 0.55rem;
            right: 0.55rem;
            width: 22px; height: 22px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
            transition: all 0.15s;
        }

        .home-saved-delete:hover { background: #fee2e2; color: #dc2626; }

        /* ── Home icon button ── */
        .home-icon-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: 38px;
            height: 38px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 60;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .home-icon-btn:hover { border-color: var(--accent2); color: var(--accent); }

        /* ── Back button ── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: transparent;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            padding: 0.45rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: 2rem;
        }

        .back-btn:hover { border-color: var(--accent2); color: var(--accent); }

        /* ── Breadcrumb ── */
        .breadcrumb {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .breadcrumb-item { font-weight: 600; }
        .breadcrumb-item.active { color: var(--accent); }
        .breadcrumb-sep { opacity: 0.4; }

        /* ── Day header ── */
        .day-header { text-align: center; margin-bottom: 1.5rem; }

        .day-header h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.85rem;
            font-weight: 400;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .day-header p {
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* ── Login prompt ── */
        .login-prompt {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            background: var(--surface2);
            border: 1.5px dashed var(--border-blue);
            border-radius: 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        .login-prompt button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 0.35rem 1rem;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ── Progress ── */
        .day-progress {
            background: var(--surface);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1.5px solid var(--border);
        }

        .progress-bar { flex: 1; height: 5px; background: var(--light-blue); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent2); border-radius: 999px; transition: width 0.4s ease; }
        .progress-text { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; font-weight: 500; }

        /* ── Exercise carousel ── */
        .exercise-carousel { overflow: hidden; touch-action: pan-y; width: 100%; max-width: 100%; position: relative; }
        .exercise-track { display: flex; transition: transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94); width: 100%; }
        .exercise-slide { flex: 0 0 100%; min-width: 0; max-width: 100%; }

        .ex-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0 0.75rem;
        }

        .ex-nav-btn {
            width: 44px; height: 44px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            border-radius: 50%;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .ex-nav-btn:disabled { opacity: 0.22; cursor: default; }

        .ex-indicator { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.01em; min-height: 1.1em; padding-bottom: 0.25rem; }
        .ex-indicator strong { color: var(--accent); font-weight: 700; }

        .ex-dots { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; flex: 1; }
        .ex-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--border);
            transition: background 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .ex-dot.active { background: var(--accent); transform: scale(1.4); }
        .ex-dot.done { background: #10b981; }

        .exercise-slide-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1.25rem 1.25rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .exercise-slide-card.completed { border-color: #a7f3d0; background: #f0fdf4; }

        .exercise-slide-counter {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .exercise-slide-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.45rem;
            color: var(--text);
            margin-bottom: 0.75rem;
            line-height: 1.25;
        }

        .exercise-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }

        .badge {
            font-size: 0.68rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            background: var(--bg);
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge.primary { background: var(--light-blue); color: var(--accent); }
        .badge.tauko { background: #fef3c7; color: #92400e; font-weight: 700; }

        .complete-toggle {
            width: 100%;
            padding: 0.9rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.25rem;
            border: 2px solid transparent;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.04em;
        }
        .complete-toggle.todo { background: var(--bg); border-color: var(--border); color: var(--text-muted); }
        .complete-toggle.done { background: #10b981; color: white; border-color: #10b981; }

        /* ── Sets table ── */
        .sets-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        .sets-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.875rem; }

        .sets-table th {
            text-align: left;
            padding: 0.5rem 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .sets-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #f8fafc; color: var(--text); }

        /* ── Set inputs ── */
        .set-input {
            width: 72px;
            padding: 0.45rem 0.5rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text);
            background: var(--bg);
            text-align: center;
            outline: none;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            touch-action: manipulation;
        }

        .set-input:focus {
            border-color: var(--accent2);
            background: white;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .prev-col-header {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-align: center;
        }
        .prev-col {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
        }

        /* ── Instructions ── */
        .instructions-details {
            margin-top: 1.25rem;
            background: var(--surface2);
            border-radius: 12px;
            border: 1px solid var(--border-blue);
            overflow: hidden;
        }
        .instructions-details summary {
            padding: 0.75rem 1rem;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .instructions-details summary::after { content: '▼'; font-size: 0.6rem; }
        .instructions-details[open] summary::after { content: '▲'; }
        .instructions-details ol {
            padding: 0 1rem 0.75rem 2rem;
            margin: 0;
            font-size: 0.83rem;
            color: var(--text-muted);
            line-height: 1.7;
        }
        .instructions-details li + li { margin-top: 0.2rem; }

        /* ── Save button ── */
        .workout-actions {
            margin-top: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .save-workout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--text);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .save-workout-btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(30,64,175,0.25);
        }

        .save-workout-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .save-log-btn {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;

<!-- Success Modal -->
<div class="success-overlay" id="success-overlay" onclick="closeSuccessOutside(event)">
    <div class="success-modal">
        <div class="success-icon">✓</div>
        <div class="success-title" id="success-title">Hienoa!</div>
        <div class="success-subtitle" id="success-subtitle">Treeni on tallennettu.</div>
        <button class="success-close-btn" onclick="closeSuccessOverlay()">Sulje</button>
    </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-header">
            <h2>Salikissan kuntosaliohjelma</h2>
            <div class="modal-tabs">
                <button class="modal-tab active" onclick="switchTab('login')">Kirjaudu</button>
                <button class="modal-tab" onclick="switchTab('register')">Rekisteröidy</button>
            </div>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div id="modal-error" class="modal-error"></div>

                <label>Käyttäjänimi</label>

                    onkeydown="if(event.key==='Enter') document.getElementById('auth-password').focus()">
            </div>
            <div class="form-group">
                <label>Salasana</label>
                <input type="password" class="form-input" id="auth-password" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') submitAuth()">
            </div>
            <button type="button" class="modal-submit" id="modal-submit-btn" onclick="submitAuth()">
                Kirjaudu sisään
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

        <div class="step-label-gap"></div>
        <div class="step-label" id="label-3">Treeni</div>

</header>

function updateStepIndicator() {
    const showIndicator = currentStep === 1 || currentStep === 2;
    document.getElementById('step-indicator').style.display = showIndicator ? '' : 'none';
    document.getElementById('step-label-row').style.display = showIndicator ? '' : 'none';

    for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        const label = document.getElementById(`label-${i}`);
        dot.className = 'step-dot' + (i === currentStep ? ' active' : i < currentStep ? ' done' : '');
        label.className = 'step-label' + (i === currentStep ? ' active' : '');
    }
    for (let i = 1; i <= 2; i++) {
        const line = document.getElementById(`line-${i}`);
        line.className = 'step-line' + (i < currentStep ? ' done' : '');

async function loadSavedPrograms() {
    if (!token) { savedPrograms = []; return; }
    try {
        const res = await fetch('/api/programs', { headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) savedPrograms = await res.json();
        else savedPrograms = [];
    } catch { savedPrograms = []; }
}

function renderHome() {
    currentStep = 0;
    selectedProgram = null;
    selectedSplit = null;
    updateStepIndicator();

    const createCard = `
        <div class="home-section-label">Uusi ohjelma</div>
        <div class="home-create-card home-create-card-wide" onclick="startCreateProgram()">
            <div class="home-create-icon">+</div>
            <div class="home-create-label">Luo uusi treeniohjelma</div>
        </div>`;

    const savedSection = savedPrograms.length ? `
        <div class="home-section-label" style="margin-top:2rem">Tallennetut treeniohjelmat</div>
        <div class="program-list-vertical">
            ${savedPrograms.map(sp => {
                const prog = programs[sp.program];
                if (!prog) return '';
                return `
                    <div class="program-card program-card-full home-saved-card" onclick="openSavedProgram(${sp.id})">
                        <button class="home-saved-delete" onclick="deleteSavedProgram(event,${sp.id})" title="Poista">×</button>

                            <div class="program-card-desc">${sp.split}-jakoinen</div>

            ${createCard}
            ${savedSection}
        </div>`;

    setTimeout(initCarousel, 0);
}

function startCreateProgram() {
    renderStep1();
}

function openSavedProgram(id) {
    const sp = savedPrograms.find(p => p.id === id);
    if (!sp) return;
    selectedProgram = sp.program;
    selectedSplit = sp.split;
    currentDay = 0;
    Object.keys(completed).forEach(k => delete completed[k]);
    renderNav();
    renderStep3(0);
}

async function deleteSavedProgram(event, id) {
    event.stopPropagation();
    if (!confirm('Poistetaanko ohjelma tallennetuista?')) return;
    try {
        const res = await fetch(`/api/programs/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) {
            savedPrograms = savedPrograms.filter(p => p.id !== id);
            renderHome();
        } else {
            showToast('Poisto epäonnistui', 'error');
        }
    } catch { showToast('Yhteysvirhe', 'error'); }
}

async function saveAndStartProgram() {
    if (!token || !selectedProgram || !selectedSplit) return;
    const btn = document.getElementById('start-program-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Tallennetaan…'; }
    try {
        const res = await fetch('/api/programs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ program: selectedProgram, split: selectedSplit }),
        });
        if (res.ok) {
            const saved = await res.json();
            savedPrograms.push(saved);
            currentDay = 0;
            Object.keys(completed).forEach(k => delete completed[k]);
            renderNav();
            renderStep3(0);
        } else {
            showToast('Tallennus epäonnistui', 'error');
            if (btn) { btn.disabled = false; btn.textContent = 'Aloita treeniohjelma'; }
        }
    } catch {
        showToast('Yhteysvirhe', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Aloita treeniohjelma'; }
    }
}

// ── Auth UI ────────────────────────────────────────────────────────────────────

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateAuthUI() {
    const slot = document.getElementById('header-auth');
    if (currentUser) {
        slot.innerHTML = `
            <div class="user-info">
                <span class="username-badge">${escapeHtml(currentUser)}</span>
                <button class="logout-btn" onclick="logout()">Kirjaudu ulos</button>
            </div>`;
    } else {
        slot.innerHTML = `<button class="auth-btn" onclick="openModal()">Kirjaudu sisään</button>`;
    }
}

function openModal() {
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('auth-username').focus(), 50);
    clearModalError();
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}

function closeModalOutside(e) {
    if (e.target.id === 'modal-overlay') closeModal();
}

function switchTab(tab) {
    activeTab = tab;
    clearModalError();
    document.querySelectorAll('.modal-tab').forEach((btn, i) => {
        btn.classList.toggle('active', i === (tab === 'login' ? 0 : 1));
    });
    document.getElementById('auth-password').autocomplete = tab === 'login' ? 'current-password' : 'new-password';
    document.getElementById('modal-submit-btn').textContent = tab === 'login' ? 'Kirjaudu sisään' : 'Luo tili';
}

function clearModalError() {
    const el = document.getElementById('modal-error');
    el.textContent = '';
    el.classList.remove('show');
}

function showModalError(msg) {
    const el = document.getElementById('modal-error');
    el.textContent = msg;
    el.classList.add('show');
}

async function submitAuth() {
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value;
    const btn = document.getElementById('modal-submit-btn');

    if (!username || !password) { showModalError('Täytä kaikki kentät'); return; }

    btn.disabled = true;
    clearModalError();

    try {
        const res = await fetch(`/api/${activeTab}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) { showModalError(data.error || 'Jokin meni pieleen'); return; }

        token = data.token;
        currentUser = data.username;
        localStorage.setItem('token', token);
        localStorage.setItem('username', currentUser);

        closeModal();
        updateAuthUI();
        await loadSavedPrograms();
        renderHome();
        showToast(`Tervetuloa, ${currentUser}!`, 'success');
    } catch {
        showModalError('Yhteysvirhe — onko palvelin käynnissä?');
    } finally {
        btn.disabled = false;
    }
}

function logout() {
    token = null;
    currentUser = null;
    lastLogs = {};
    savedPrograms = [];
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    updateAuthUI();
    renderStep1();
    showToast('Kirjauduttu ulos', 'success');
}

// ── API ────────────────────────────────────────────────────────────────────────

function splitKey() {
    return `${selectedProgram}-${selectedSplit}`;
}

async function loadLastLogs() {
    if (!token) { lastLogs = {}; return; }
    try {
        const res = await fetch(`/api/logs/last?split=${splitKey()}&day_index=${currentDay}`, {
            headers: { Authorization: `Bearer ${token}` },
        });
        if (res.status === 401) { logout(); return; }
        const rows = await res.json();
        lastLogs = {};
        rows.forEach(r => { lastLogs[`${r.exercise_index}-${r.set_index}`] = r; });
    } catch {
        lastLogs = {};
    }
}

function collectSets() {
    const map = new Map();
    document.querySelectorAll('.set-input').forEach(inp => {
        const key = `${inp.dataset.ei}-${inp.dataset.si}`;
        if (!map.has(key)) map.set(key, { exercise_index: +inp.dataset.ei, set_index: +inp.dataset.si, weight: null, reps: null });
        const raw = parseFloat(inp.value);
        const val = inp.value.trim() !== '' && !isNaN(raw) ? raw : null;
        const entry = map.get(key);
        if (inp.dataset.type === 'reps') entry.reps = val;
        if (inp.dataset.type === 'weight') entry.weight = val;
    });
    return [...map.values()].filter(s => s.weight !== null || s.reps !== null);
}

let _autoSaveTimer = null;

function scheduleAutoSave() {
    if (!token) return;
    clearTimeout(_autoSaveTimer);
    _autoSaveTimer = setTimeout(() => saveLogs(false, true), 1500);
}

async function saveLogs(finish = false, silent = false) {
    if (!token) return;

    const sets = collectSets();
    if (!sets.length) {
        if (!silent) showToast('Ei tallennettavaa — täytä ensin painot tai toistot', 'error');
        return;
    }

    if (!silent) {
        const saveBtn = document.getElementById('save-btn');
        const finishBtn = document.getElementById('finish-btn');
        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Tallennetaan…'; }
        if (finishBtn) { finishBtn.disabled = true; finishBtn.textContent = 'Tallennetaan…'; }
    }

    try {
        const date = new Date().toISOString().split('T')[0];
        const res = await fetch('/api/logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ date, split: splitKey(), day_index: currentDay, sets }),
        });

        if (res.ok) {
            await loadLastLogs();
            if (finish) {
                renderHome();
                showSuccessOverlay();
            } else if (!silent) {
                showToast('Tulokset tallennettu!', 'success');
            }
        } else {
            if (!silent) {
                const d = await res.json();
                showToast(d.error || 'Tallennus epäonnistui', 'error');
            }
        }
    } catch {
        if (!silent) showToast('Yhteysvirhe', 'error');
    } finally {
        if (!silent) {
            const saveBtn = document.getElementById('save-btn');
            const finishBtn = document.getElementById('finish-btn');
            if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Tallenna tulokset'; }
            if (finishBtn) { finishBtn.disabled = false; finishBtn.textContent = 'Lopeta ja tallenna'; }
        }
    }
}

function showSuccessOverlay() {
    const msg = successMessages[Math.floor(Math.random() * successMessages.length)];
    document.getElementById('success-title').textContent = msg.title;
    document.getElementById('success-subtitle').textContent = msg.sub;
    document.getElementById('success-overlay').classList.add('open');
}

function closeSuccessOverlay() {
    document.getElementById('success-overlay').classList.remove('open');
}

function closeSuccessOutside(e) {
    if (e.target.id === 'success-overlay') closeSuccessOverlay();
}

// ── Exercise rendering ─────────────────────────────────────────────────────────

function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${parseInt(d)}.${parseInt(m)}.${y}`;
}

function renderExercises(idx) {
    const track = document.getElementById('exercise-track');
    if (!track) return;
    const day = programs[selectedProgram].splits[selectedSplit][idx];
    const total = day.harjoitukset.length;
    track.innerHTML = '';

    day.harjoitukset.forEach((ex, i) => {
        const done = completed[idx]?.has(i);

        let lastDate = null;
        for (let si = 0; si < ex.sets.length; si++) {
            const log = lastLogs[`${i}-${si}`];
            if (log?.date) { lastDate = log.date; break; }
        }

        const setsHtml = token
            ? `<table class="sets-table">
                <thead><tr>
                    <th>Sarja</th>
                    <th>Toistot</th>
                    <th class="prev-col-header">Aiempi tulos</th>
                    <th>Paino (kg)</th>
                    <th class="prev-col-header">Aiempi tulos</th>
                </tr></thead>
                <tbody>${ex.sets.map((s, si) => {
                    const log = lastLogs[`${i}-${si}`];
                    const prevReps   = log?.reps   != null ? log.reps   : '<span style="color:var(--border)">—</span>';
                    const prevWeight = log?.weight  != null ? `${log.weight} kg` : '<span style="color:var(--border)">—</span>';
                    return `<tr>
                        <td>${s.sarja}</td>
                        <td><input class="set-input" inputmode="numeric" type="text"
                            placeholder="${s.toistot}"
                            data-ei="${i}" data-si="${si}" data-type="reps"></td>
                        <td class="prev-col">${prevReps}</td>
                        <td><input class="set-input" inputmode="decimal" type="number" min="0" max="9999" step="0.5"
                            placeholder="kg"
                            data-ei="${i}" data-si="${si}" data-type="weight"></td>
                        <td class="prev-col">${prevWeight}</td>
                    </tr>`;
                }).join('')}</tbody>
               </table>`
            : `<table class="sets-table">
                <thead><tr><th>Sarja</th><th>Toistot</th><th>Paino (kg)</th></tr></thead>
                <tbody>${ex.sets.map(s => `<tr><td>${s.sarja}</td><td>${s.toistot}</td><td></td></tr>`).join('')}</tbody>
               </table>`;

        const slide = document.createElement('div');
        slide.className = 'exercise-slide';
        slide.innerHTML = `
            <div class="exercise-slide-card${done ? ' completed' : ''}" data-ex="${i}">
                <div class="exercise-slide-name">${ex.name}</div>
                <div class="exercise-meta">
                    <span class="badge primary">${ex.muscles.split(',')[0].trim()}</span>
                    <span class="badge">${ex.sets.length} sarjaa</span>
                    ${ex.tauko ? `<span class="badge tauko">Tauko ${ex.tauko}s</span>` : ''}
                    ${lastDate ? `<span class="badge">Kirjattu ${formatDate(lastDate)}</span>` : ''}
                </div>
                <div class="sets-table-wrapper">${setsHtml}</div>
                <button class="complete-toggle ${done ? 'done' : 'todo'}" onclick="toggleComplete(${idx}, ${i}, event)">
                    ${done ? '✓ Merkitty tehdy' : 'Merkitse tehty'}
                </button>
                <details class="instructions-details">
                    <summary>Suoritustekniikka</summary>
                    <ol>${ex.instructions.map(step => `<li>${step}</li>`).join('')}</ol>
                </details>
            </div>`;
        track.appendChild(slide);
    });

    const dotsEl = document.getElementById('ex-dots');
    if (dotsEl) {
        dotsEl.innerHTML = day.harjoitukset.map((_, i) => {
            const isDone = completed[idx]?.has(i);
            const cls = i === currentExercise ? 'active' : isDone ? 'done' : '';
            return `<span class="ex-dot ${cls}" onclick="goToExercise(${i})"></span>`;
        }).join('');
    }

    updateExerciseNav();
    updateProgress(idx);
    setupExerciseSwipe();
    if (token) {
        document.querySelectorAll('.set-input').forEach(inp => {
            inp.addEventListener('input', scheduleAutoSave);
        });
    }
}

function goToExercise(n) {
    const day = programs[selectedProgram].splits[selectedSplit][currentDay];
    currentExercise = Math.max(0, Math.min(n, day.harjoitukset.length - 1));
    const track = document.getElementById('exercise-track');
    if (track) track.style.transform = `translateX(-${currentExercise * 100}%)`;
    updateExerciseNav();
}

function prevExercise() { goToExercise(currentExercise - 1); }
function nextExercise() { goToExercise(currentExercise + 1); }

function updateExerciseNav() {
    const day = programs[selectedProgram].splits[selectedSplit][currentDay];
    const total = day.harjoitukset.length;
    const ex = day.harjoitukset[currentExercise];

    const prev = document.getElementById('ex-prev');
    const next = document.getElementById('ex-next');
    if (prev) prev.disabled = currentExercise === 0;
    if (next) next.disabled = currentExercise === total - 1;

    document.querySelectorAll('.ex-dot').forEach((dot, i) => {
        const isDone = completed[currentDay]?.has(i);
        dot.className = 'ex-dot' + (i === currentExercise ? ' active' : isDone ? ' done' : '');
    });

    const indicator = document.getElementById('ex-indicator');
    if (indicator) indicator.innerHTML = '';
}

function toggleComplete(dayIdx, exIdx, event) {
    event?.stopPropagation();
    if (!completed[dayIdx]) completed[dayIdx] = new Set();
    if (completed[dayIdx].has(exIdx)) completed[dayIdx].delete(exIdx);
    else completed[dayIdx].add(exIdx);

    const isDone = completed[dayIdx].has(exIdx);
    const card = document.querySelector(`.exercise-slide-card[data-ex="${exIdx}"]`);
    if (card) {
        card.classList.toggle('completed', isDone);
        const btn = card.querySelector('.complete-toggle');
        if (btn) { btn.className = `complete-toggle ${isDone ? 'done' : 'todo'}`; btn.textContent = isDone ? '✓ Merkitty tehty' : 'Merkitse tehty'; }
    }
    updateProgress(dayIdx);
    updateExerciseNav();
}

let _touchStartX = 0;
let _touchStartY = 0;

function setupExerciseSwipe() {
    const el = document.getElementById('exercise-carousel');
    if (!el || el._swipeReady) return;
    el._swipeReady = true;
    el.addEventListener('touchstart', e => {
        _touchStartX = e.touches[0].clientX;
        _touchStartY = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - _touchStartX;
        const dy = e.changedTouches[0].clientY - _touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 48) {
            if (dx < 0) nextExercise();
            else prevExercise();
        }
    }, { passive: true });
}

function updateProgress(idx) {
    const total = programs[selectedProgram].splits[selectedSplit][idx]?.harjoitukset.length || 0;
    const done = completed[idx]?.size || 0;
    const pct = total > 0 ? (done / total) * 100 : 0;
    const fill = document.getElementById('progress-fill');
    const text = document.getElementById('progress-text');
    if (fill) fill.style.width = pct + '%';
    if (text) text.textContent = `${done} / ${total} tehty`;
}

// ── Carousel ───────────────────────────────────────────────────────────────────

function initCarousel() {
    const track = document.getElementById('program-track');
    if (!track) return;
    track.addEventListener('scroll', updateCarouselArrows);
    updateCarouselArrows();
}

function updateCarouselArrows() {
    const track = document.getElementById('program-track');
    const prev = document.getElementById('arrow-prev');
    const next = document.getElementById('arrow-next');
    if (!track || !prev || !next) return;
    const canScrollLeft = track.scrollLeft > 1;
    const canScrollRight = track.scrollLeft + track.clientWidth < track.scrollWidth - 1;
    prev.style.display = canScrollLeft ? 'flex' : 'none';
    next.style.display = canScrollRight ? 'flex' : 'none';
}

function carouselPrev() {
    const track = document.getElementById('program-track');
    if (track) track.scrollBy({ left: -(track.clientWidth / 2), behavior: 'smooth' });
}

function carouselNext() {
    const track = document.getElementById('program-track');
    if (track) track.scrollBy({ left: track.clientWidth / 2, behavior: 'smooth' });
}

// ── Toast ──────────────────────────────────────────────────────────────────────

function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Prevent horizontal scroll on iOS ──────────────────────────────────────────

document.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1) {
        const touch = e.touches[0];
        const el = e.target.closest('.exercise-carousel, .program-track, .sets-table-wrapper');
        if (!el) {
            const startX = touch.clientX;
            const startY = touch.clientY;
        }
    }
}, { passive: true });

// ── Init ───────────────────────────────────────────────────────────────────────

updateAuthUI();
if (token) {
    loadSavedPrograms().then(() => renderHome());
} else {
    renderStep1();
}
</script>
